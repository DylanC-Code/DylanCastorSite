pre-commit:
    jobs:
        - name: fmt
          run: bun x --bun oxfmt --check --no-error-on-unmatched-pattern {staged_files}
        # oxfmt does not read .astro files yet: Prettier formats those alone.
        - name: fmt astro
          glob: "*.astro"
          run: bun x --bun prettier --check {staged_files}
        - name: lint
          run: bun x --bun oxlint --no-error-on-unmatched-pattern {staged_files}

commit-msg:
    jobs:
        - name: commitlint
          run: bun x --bun commitlint --edit {1}

pre-push:
    jobs:
        - name: check
          run: bun run check
