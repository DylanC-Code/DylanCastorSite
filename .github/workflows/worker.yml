name: worker

# The form Worker (src/interfaces/form_worker, wrangler.jsonc): every push to
# main is tested, bundled, then deployed to Cloudflare. A push to main is
# Dylan's OK to deploy the Worker (decided 15 Nov 2026).
on:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: worker
    cancel-in-progress: false

jobs:
    bundle:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            # Actions pinned by commit, as in TightStack.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: 2026.10.21
            - run: bun install --frozen-lockfile
            - run: bun run test
            - run: bun run worker:bundle

    deploy:
        needs: bundle
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # The Cloudflare secrets live in the "production" environment (or the
        # repository's own secrets); no approval is asked.
        environment: production
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  version: 2026.10.21
            - run: bun install --frozen-lockfile
            # A token limited to Workers Scripts (account) and Workers Routes
            # (dylancastor.com): it can touch no DNS and no mail record.
            - run: bun run worker:deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
